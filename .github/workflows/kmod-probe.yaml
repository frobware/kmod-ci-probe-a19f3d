name: kmod-probe

on:
  push:
  workflow_dispatch:

jobs:
  kmod-probe:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - ubuntu-24.04
          - ubuntu-latest
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v5

      - name: Runner kernel
        run: |
          set -euxo pipefail
          uname -a
          cat /etc/os-release
          id
          ls -ld /lib/modules/$(uname -r) || true
          ls -ld /lib/modules/$(uname -r)/build || true
          test -d /lib/modules/$(uname -r)/build

      - name: Install build tools and matching headers
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential kmod linux-headers-$(uname -r)

      - name: Build module
        run: |
          set -euxo pipefail
          cp -rs /lib/modules/$(uname -r)/build kbuild
          chmod -R u+w kbuild
          if [ -e /sys/kernel/btf/vmlinux ]; then
            ln -sf /sys/kernel/btf/vmlinux kbuild/vmlinux
          fi
          make -C e2e/kmod KDIR="$PWD/kbuild"
          test -f e2e/kmod/bpfman_e2e_targets.ko
          modinfo e2e/kmod/bpfman_e2e_targets.ko

      - name: Load, trigger, unload
        run: |
          set -euxo pipefail
          sudo mount -t debugfs debugfs /sys/kernel/debug || true
          sudo insmod e2e/kmod/bpfman_e2e_targets.ko
          trap 'sudo rmmod bpfman_e2e_targets || true' EXIT
          lsmod | grep bpfman_e2e_targets
          sudo dmesg | tail -100 || true
          sudo test -d /sys/kernel/debug/bpfman_e2e
          sudo ls -la /sys/kernel/debug/bpfman_e2e
          sudo test -e /sys/kernel/debug/bpfman_e2e/trigger_000
          printf x | sudo tee /sys/kernel/debug/bpfman_e2e/trigger_000 >/dev/null
          sudo dmesg | tail -100 || true
